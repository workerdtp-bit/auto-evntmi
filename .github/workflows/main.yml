name: EVN get data

on:
  schedule:
    # 01:00 UTC tương ứng với 11:00 giờ Việt Nam (GMT+7)
    - cron: '00 01 * * 1,2,3,4,5'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240 

    # Cấp đầy đủ quyền cho Actions và Contents để tránh bị chặn truy cập
    permissions:
      contents: write
      actions: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium pandas webdriver-manager openpyxl gspread google-auth

      - name: Run scraper
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
        run: |
          export PYTHONUNBUFFERED=1
          python main.py

      - name: Upload results
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: evn-result
          path: |
            datasauget.csv
            output.xlsx

      # Sử dụng Action Keepalive thế hệ mới an toàn và nhẹ hơn
      - name: Auto Keepalive
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "chore: auto keepalive [skip ci]"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 45
